[tools]
node = "24"
"aqua:lycheeverse/lychee" = "latest"

[tasks.dev]
description = "preprocess watch + zola serve"
run = """
(cd tools/embed-gen && npm run watch) &
WATCHER=$!
trap "kill $WATCHER 2>/dev/null" EXIT
zola serve
"""

[tasks."dev:mobile"]
description = "preprocess watch + zola serve (LAN 公開)"
run = """
(cd tools/embed-gen && npm run watch) &
WATCHER=$!
trap "kill $WATCHER 2>/dev/null" EXIT
zola serve --interface 0.0.0.0 --base-url http://mini.local
"""

[tasks.fetch]
description = "card / x-post の oEmbed / OG メタデータを取得・キャッシュ"
dir = "tools/embed-gen"
run = "npm run fetch --"

[tasks."check:links"]
description = "src/*.md の外部デッドリンクを lychee で検出"
run = "lychee src/*.md"
