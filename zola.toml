base_url = "https://notes.januswel.com"
title = "Notes"
description = "januswel の雑記"
compile_sass = false
minify_html = true
generate_feeds = true
generate_sitemap = true
theme = "anemone"

taxonomies = [
    {name = "tags", feed = true, paginate_by = 10},
]

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
author = "januswel"
list_pages = true
enable_search = false

header_nav = [
  { url = "/", name_en = "/home/" },
]
